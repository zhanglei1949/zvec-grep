name: SWE-QA Bench
run-name: Canonical MCP acceptance / Xarray / ${{ inputs.candidate_ref }}

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Immutable candidate SHA matching this isolated branch
        type: string
        required: true

permissions: {}
env:
  SWE_QA_MODEL: glm-5.2
  SWE_QA_MODEL_BASE_URL: ${{ vars.SWE_QA_MODEL_BASE_URL }}

jobs:
  canonical-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - name: Authorize this manual run
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_REPOSITORY: ${{ github.repository }}
          BENCH_ACTOR: ${{ github.actor }}
          BENCH_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CANDIDATE: ${{ inputs.candidate_ref }}
          HARNESS: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE" = "$HARNESS"
          for actor in "$BENCH_ACTOR" "$BENCH_TRIGGERING_ACTOR"; do
            role="$(gh api "repos/$BENCH_REPOSITORY/collaborators/$actor/permission" --jq '.role_name')"
            case "$role" in admin|maintain) ;; *) exit 1 ;; esac
          done
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Build the reviewed candidate
        id: rust-candidate
        uses: ./.github/actions/rust-candidate-package
        with:
          candidate_repository: ${{ github.repository }}
          candidate_ref: ${{ inputs.candidate_ref }}
          cache_namespace: swe-qa-rust
      - name: Install the same diagnostic runtime
        run: |
          npm install --global "$RUNNER_TEMP/rust-package-cache/candidate.tgz" @zvec/bindings-linux-x64@0.5.0 opencode-ai@1.18.4 --omit=optional --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y ripgrep
          sudo mkdir -p /app
          sudo chown "$USER" /app
      - name: Preflight, one pilot, then at most four further fresh sessions
        env:
          DIAGNOSTIC_CANDIDATE: ${{ steps.rust-candidate.outputs.commit }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          PYTHONPATH: benchmarks/swe-qa-bench
        run: |
          test -n "$GLM_API_KEY"
          python -m zg_bench.canonical_schema_e2e --output "$RUNNER_TEMP/diagnostic"
      - if: always() && steps.authorize.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: zg-canonical-schema-xarray-32-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/diagnostic/
            ${{ runner.temp }}/rust-package-cache/manifest.json
          if-no-files-found: warn
          retention-days: 90
