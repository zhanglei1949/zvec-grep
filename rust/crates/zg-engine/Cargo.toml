[package]
name = "zg-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Binding-independent relation fact inspection; persistence awaits graphdb.
knowledge-graph = ["dep:zg-knowledge"]
# Candidate persistence/publication and read-only code exploration.
knowledge-graph-graphdb = ["knowledge-graph", "zg-knowledge/graphdb"]
# CUDA and Vulkan require their native toolchains at build time. Platform
# release builds enable the matching feature, while unsupported requests keep
# the same warning-and-CPU-fallback behavior as main.
cuda = ["llama-cpp-2/cuda", "ort/cuda"]
vulkan = ["llama-cpp-2/vulkan", "ort/webgpu"]

[dependencies]
schemars.workspace = true
async-trait.workspace = true
base64 = "0.23.1"
futures-util = "0.3.34"
globset.workspace = true
grep.workspace = true
half = "2.7.1"
hex = "0.4.3"
ignore.workspace = true
hmac-sha256 = "1.1.14"
httpdate = "1.0.3"
llama-cpp-2 = { version = "0.1.154", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["api-27", "copy-dylibs", "download-binaries", "std", "tls-rustls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
rayon = "1.11.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-go.workspace = true
tree-sitter-java.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
uuid.workspace = true
zg-engine-macros = { path = "macros" }
zg-host-native = { path = "../zg-host-native" }
zg-markdown = { path = "../zg-markdown" }
zg-storage = { path = "../zg-storage", features = ["zvec"] }
zg-knowledge = { path = "../zg-knowledge", optional = true }
zvec-rust.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1.0.5"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["directml"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[example]]
name = "graph_facts"
required-features = ["knowledge-graph"]

[[example]]
name = "graph_fact_capture"
required-features = ["knowledge-graph"]

[[example]]
name = "graph_build"
required-features = ["knowledge-graph-graphdb"]

[[example]]
name = "graph_coverage"
required-features = ["knowledge-graph"]

[[example]]
name = "graph_audit"
required-features = ["knowledge-graph-graphdb"]
