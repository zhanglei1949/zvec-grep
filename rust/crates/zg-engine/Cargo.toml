[package]
name = "zg-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Host fact capture is opt-in; shared pure Rust query contracts are always available.
knowledge-graph = []
# Candidate persistence/publication and read-only code exploration.
knowledge-graph-graphdb = ["knowledge-graph", "zg-knowledge/graphdb"]
# Matching CUDA builds reuse the pinned native SDK; custom CUDA/Vulkan
# configurations require source toolchains. Runtime CPU fallback is unchanged.
cuda = [
    "dep:zg-llama-native",
    "llama-cpp-2/cuda",
    "llama-cpp-2/dynamic-backends",
    "ort/cuda",
]
vulkan = ["llama-cpp-2/vulkan", "ort/webgpu"]

[dependencies]
schemars.workspace = true
async-trait.workspace = true
base64 = "0.23.1"
encoding_rs = "0.8.35"
futures-util = "0.3.34"
globset.workspace = true
grep.workspace = true
half = "2.7.1"
hex = "0.4.3"
ignore.workspace = true
hmac-sha256 = "1.1.14"
httpdate = "1.0.3"
llama-cpp-2.workspace = true
# Use the same pinned official runtime in Cargo tests and every native package.
# API selection does not select the download version; build.rs owns that pin.
ort.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
rayon = "1.11.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shutdown_hooks = "0.1.0"
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-go.workspace = true
tree-sitter-java.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
uuid.workspace = true
zg-engine-macros = { path = "macros" }
zg-host-native = { path = "../zg-host-native" }
zg-markdown = { path = "../zg-markdown" }
zg-storage = { path = "../zg-storage", features = ["zvec"] }
zg-knowledge = { path = "../zg-knowledge" }
zg-llama-native = { path = "../zg-llama-native", optional = true }
zvec-rust.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1.0.5"
ort = { workspace = true, features = ["directml"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true

[[example]]
name = "graph_facts"
required-features = ["knowledge-graph"]

[[example]]
name = "graph_fact_capture"
required-features = ["knowledge-graph"]

[[example]]
name = "graph_build"
required-features = ["knowledge-graph-graphdb"]

[[example]]
name = "graph_coverage"
required-features = ["knowledge-graph"]

[[example]]
name = "graph_audit"
required-features = ["knowledge-graph-graphdb"]

[[example]]
name = "graph_semantic_seed"
required-features = ["knowledge-graph-graphdb"]

[[example]]
name = "m7_api"
required-features = ["knowledge-graph-graphdb"]
